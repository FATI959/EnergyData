# ============================================================
# EnergyData Lakehouse — Simulation Configuration
# Sprint 1 | Membre A — Data Platform Engineer
# ============================================================

simulation:
  # Nombre total de capteurs/compteurs simulés
  num_devices: 50
  # Fréquence d'envoi par capteur (secondes)
  emit_interval_seconds: 5
  # Durée totale de simulation (secondes). 0 = infini
  duration_seconds: 0
  # Taux d'anomalies injectées (% des événements)
  anomaly_rate: 0.02

devices:
  # Préfixe des identifiants de capteurs
  id_prefix: "METER"
  # Zones géographiques disponibles
  zones:
    - name: "Industrial_Park"
      substation_id: "SUBSTATION_NORTH_01"
      latitude: 48.8566
      longitude: 2.3522
      num_devices: 20
    - name: "Residential"
      substation_id: "SUBSTATION_SOUTH_02"
      latitude: 48.8300
      longitude: 2.3700
      num_devices: 20
    - name: "Commercial"
      substation_id: "SUBSTATION_EAST_03"
      latitude: 48.8700
      longitude: 2.4000
      num_devices: 10

physics:
  # Plages nominales des métriques énergétiques
  voltage:
    nominal_v: 230.0
    std_dev: 3.0        # bruit gaussien ±3V
    min_valid: 100.0
    max_valid: 280.0
  current:
    min_a: 1.0
    max_a: 50.0
    std_dev: 2.0
  active_power:
    min_kw: 0.1
    max_kw: 150.0
  power_factor:
    nominal: 0.95
    std_dev: 0.02
    min_valid: 0.0
    max_valid: 1.0
  frequency:
    nominal_hz: 50.0
    std_dev: 0.05
    min_valid: 48.0
    max_valid: 52.0

anomalies:
  types:
    - name: "Overvoltage"
      probability: 0.25     # Poids relatif parmi les anomalies
      voltage_multiplier: 1.15
    - name: "Undervoltage"
      probability: 0.25
      voltage_multiplier: 0.80
    - name: "PowerFactorDrop"
      probability: 0.20
      power_factor_value: 0.65
    - name: "AbruptDisconnection"
      probability: 0.15
      # Capteur muet pendant N cycles
      silent_cycles: 3
    - name: "FrequencyDeviation"
      probability: 0.15
      frequency_offset: 2.5   # +/- Hz par rapport au nominal

weather:
  # API Open-Meteo (gratuite, sans clé)
  api_url: "https://api.open-meteo.com/v1/forecast"
  # Fallback si l'API est indisponible
  fallback_temp_c: 18.0
  # Mise en cache de la température (secondes)
  cache_ttl_seconds: 300

output:
  # Dossier de sortie pour les payloads JSON locaux (validation)
  local_output_dir: "output/simulation"
  # Nombre max de fichiers JSONL locaux conservés
  max_local_files: 10
  # Afficher les logs en console
  verbose: true
